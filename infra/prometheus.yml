global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    static_configs:
      - targets: ["backend:8001"]
    metrics_path: "/metrics"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    # Note: Requires postgres_exporter sidecar for actual metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    # Note: Requires redis_exporter sidecar for actual metrics